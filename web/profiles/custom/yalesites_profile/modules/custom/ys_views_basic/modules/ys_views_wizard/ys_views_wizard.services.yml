services:
  ys_views_wizard.options:
    class: Drupal\ys_views_wizard\ViewsWizardOptions
    arguments:
      - '@plugin.manager.block'
      - '@context.repository'
      - '@ys_views_basic.views_basic_manager'

  ys_views_wizard.gin_lb_context_validator:
    class: Drupal\ys_views_wizard\GinLbContextValidator
    decorates: gin_lb.context_validator
    arguments:
      - '@ys_views_wizard.gin_lb_context_validator.inner'
