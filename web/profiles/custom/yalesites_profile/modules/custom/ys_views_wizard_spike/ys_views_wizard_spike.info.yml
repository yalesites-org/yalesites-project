name: 'YaleSites Views Wizard (SPIKE)'
type: module
description: 'THROWAWAY SPIKE for yalesites-org/YaleSites-Internal#1586. Prototype A: the thirteen listing tiles in the Layout Builder block picker collapse into one entry that opens a two-question wizard and redirects into the core add-block form for the matching bundle. Not for release.'
package: 'YaleSites SPIKE'
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:layout_builder
  - layout_builder_browser:layout_builder_browser
  - yalesites_profile:ys_views_basic
