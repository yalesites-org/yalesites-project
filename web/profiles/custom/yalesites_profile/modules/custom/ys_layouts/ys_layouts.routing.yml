ys_layouts.settings_form:
  path: '/admin/config/ys-layouts/settings'
  defaults:
    _form: '\Drupal\ys_layouts\Form\YaleSitesLayoutsSettingsForm'
    _title: 'YaleSites Layout Builder'
  requirements:
    _permission: 'administer site configuration'
ys_layouts.resource_download:
  path: '/resource/download/{file_id}'
  defaults:
    _controller: '\Drupal\ys_layouts\Controller\ResourceDownloadController::download'
    _title: 'Download Resource File'
  requirements:
    _custom_access: '\Drupal\ys_layouts\Controller\ResourceDownloadController::access'
    file_id: '\d+'
block_content.add_page:
  path: '/block/add'
  defaults:
    _controller: '\Drupal\block_content\Controller\BlockContentController::add'
    _title: 'Add reusable block'
  options:
    _admin_route: TRUE
  requirements:
    _entity_create_any_access: 'block_content'
ys_layouts.detach_reusable_block:
  path: '/layout_builder/detach/block/{section_storage_type}/{section_storage}/{delta}/{region}/{uuid}'
  defaults:
    _form: '\Drupal\ys_layouts\Form\DetachReusableBlockForm'
  requirements:
    _layout_builder_access: 'view'
    _ys_layouts_detach_reusable_block: 'TRUE'
  options:
    _admin_route: TRUE
    parameters:
      section_storage:
        layout_builder_tempstore: TRUE

# Clones an inline block in Layout Builder. Mirrors layout_builder.remove_block
# so the block contextual link can reuse the same route parameters.
ys_layouts.clone_block:
  path: '/layout_builder/clone/block/{section_storage_type}/{section_storage}/{delta}/{region}/{uuid}'
  defaults:
    _controller: '\Drupal\ys_layouts\Controller\CloneBlockController::build'
  requirements:
    _layout_builder_access: 'view'
  options:
    _admin_route: TRUE
    parameters:
      section_storage:
        layout_builder_tempstore: TRUE

# Reports Layout Builder inline blocks left behind when a non-reusable block was
# removed from a layout. Report-only; deletion is the separate confirm step
# below. Lives under /admin/yalesites rather than beside
# ys_layouts.settings_form, whose 'administer site configuration' permission no
# role on the platform actually holds. No _admin_route needed: already /admin/*.
ys_layouts.orphaned_blocks_report:
  path: '/admin/yalesites/orphaned-inline-blocks'
  defaults:
    _controller: '\Drupal\ys_layouts\Controller\OrphanedInlineBlockReportController::build'
    _title: 'Orphaned inline blocks'
  requirements:
    _permission: 'administer orphaned inline blocks'
ys_layouts.orphaned_blocks_delete:
  path: '/admin/yalesites/orphaned-inline-blocks/delete'
  defaults:
    _form: '\Drupal\ys_layouts\Form\OrphanedInlineBlockDeleteForm'
    _title: 'Delete orphaned inline blocks'
  requirements:
    _permission: 'administer orphaned inline blocks'
