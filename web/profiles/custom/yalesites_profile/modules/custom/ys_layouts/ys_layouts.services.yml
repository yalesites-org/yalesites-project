services:
  # Custom channel for error logging.
  logger.channel.ys_layouts:
    parent: logger.channel_base
    arguments: ['ys_layouts']
  # Used to update layout builder configuration on existing entities.
  ys_layouts.updater:
    class: Drupal\ys_layouts\Service\LayoutUpdater
    arguments: ['@config.factory', '@database', '@entity_type.manager', '@entity_field.manager', '@logger.channel.ys_layouts', '@messenger']
  # en_US Unicode collator used by ResourceAuthorBuilder for last-then-first
  # sorting of merged affiliated/non-affiliated authors. Registered as a
  # service so it can be injected and overridden in tests if needed.
  ys_layouts.author_collator:
    class: Collator
    arguments: ['en_US']
  # Builds the merged + sorted author list for Resource nodes.
  # Used by ResourceMetaBlock and atomic_preprocess_node() so the block
  # render and the view-row templates produce identical output.
  ys_layouts.resource_author_builder:
    class: Drupal\ys_layouts\Service\ResourceAuthorBuilder
    arguments: ['@ys_layouts.author_collator']
  # Converts a placed reusable block into an independent inline block
  # (instance-level detach) for the Layout Builder "Make non-reusable" action.
  ys_layouts.reusable_block_detacher:
    class: Drupal\ys_layouts\ReusableBlockDetacher
    arguments: ['@entity.repository', '@entity_type.manager']
  # Restricts the detach route (and its contextual link) to placements of
  # reusable content blocks.
  ys_layouts.detach_reusable_block_access:
    class: Drupal\ys_layouts\Access\DetachReusableBlockAccessCheck
    arguments:
      - '@ys_layouts.reusable_block_detacher'
      - '@logger.channel.ys_layouts'
      - '@layout_builder.tempstore_repository'
    tags:
      - { name: access_check, applies_to: _ys_layouts_detach_reusable_block }
  # Resolves cover-image alt text for Resource media.
  # Used by ResourceMetaBlock and atomic_preprocess_node() so the block
  # render and the card/list templates apply identical alt text.
  ys_layouts.media_alt_resolver:
    class: Drupal\ys_layouts\Service\MediaAltResolver
  # Clones a single inline block within a Layout Builder section. Reuses
  # quick_node_clone's deep-clone helpers so per-block cloning and node cloning
  # stay in sync.
  ys_layouts.block_cloner:
    class: Drupal\ys_layouts\Service\BlockCloner
    arguments: ['@quick_node_clone.entity.form_builder', '@uuid', '@entity_type.manager', '@logger.channel.ys_layouts']
  # Clones a whole Layout Builder section, blocks included. Delegates per-block
  # duplication to ys_layouts.block_cloner so section cloning and the
  # single-block clone stay in sync.
  ys_layouts.section_cloner:
    class: Drupal\ys_layouts\Service\SectionCloner
    arguments: ['@ys_layouts.block_cloner', '@uuid']
  # Keeps the section clone route inside layout_builder_lock's rules, which that
  # module enforces on core's section routes but cannot know about this one.
  ys_layouts.clone_section_access:
    class: Drupal\ys_layouts\Access\CloneSectionAccessCheck
    tags:
      - { name: access_check, applies_to: _ys_layouts_clone_section }
  # Finds inline blocks left behind when an editor removes a non-reusable block
  # from a layout. Core cannot collect these for revisionable entities, so the
  # sweep is on demand via drush ys-layouts:orphaned-blocks.
  ys_layouts.orphaned_inline_block_cleaner:
    class: Drupal\ys_layouts\Service\OrphanedInlineBlockCleaner
    arguments: ['@entity_type.manager', '@entity_field.manager', '@inline_block.usage', '@logger.channel.ys_layouts']

  # Alias to allow type-hinting against the interface.
  Drupal\ys_layouts\Service\OrphanedInlineBlockCleanerInterface:
    alias: ys_layouts.orphaned_inline_block_cleaner
