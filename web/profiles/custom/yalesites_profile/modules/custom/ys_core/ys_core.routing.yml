# Creates new section in the admin menu for YaleSites settings.
ys_core.admin_yalesites:
  path: '/admin/yalesites'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'YaleSites'
  requirements:
    _permission: 'yalesites manage settings'
# Sitewide settings form.
ys_core.admin_site_settings:
  path: '/admin/yalesites/settings'
  defaults:
    _form: '\Drupal\ys_core\Form\SiteSettingsForm'
    _title: 'Site Settings'
  requirements:
    _permission: 'yalesites manage settings'
# Header settings form.
ys_core.admin_header_settings:
  path: '/admin/yalesites/header'
  defaults:
    _form: 'Drupal\ys_core\Form\HeaderSettingsForm'
    _title: 'Header Settings'
  requirements:
    _permission: 'yalesites manage settings'
# Footer settings form.
ys_core.admin_footer_settings:
  path: '/admin/yalesites/footer'
  defaults:
    _form: 'Drupal\ys_core\Form\FooterSettingsForm'
    _title: 'Footer Settings'
  requirements:
    _permission: 'yalesites manage settings'
# Editorial dashboard.
ys_core.admin_dashboard:
  path: '/admin/yalesites/dashboard'
  defaults:
    _controller: '\Drupal\ys_core\Controller\DashboardController::content'
    _title: 'Dashboard'
  requirements:
    _permission: 'yalesites manage settings'
# Views settings form.
ys_core.admin_views_settings:
  path: '/admin/yalesites/views-settings'
  defaults:
    _form: '\Drupal\ys_core\Form\ViewsSettingsForm'
    _title: 'Search Settings'
  requirements:
    _permission: 'yalesites manage settings'
# Platform-admin-only section landing page.
#
# Uses core's menu-block controller, like ys_core.admin_yalesites above, so the
# page lists its own child links. A form route cannot do that, which is why
# platform-admin-only screens hang here rather than under the settings form.
#
# Access is deliberately core's _access_admin_menu_block_page check with no
# _permission of its own. Route requirements are ANDed, so a permission here
# would gate the whole section on it -- and Drupal prunes a menu subtree whose
# parent fails access, so a role holding only one child's permission (say
# 'access site reports') would lose that child from the menu while its URL kept
# working. The menu-block check grants access when at least one child is
# reachable, so the section can never hide a screen the user may see, and it
# needs no edit when children change. The section stays platform-admin-only
# because every child is.
#
# @see \Drupal\system\Access\SystemAdminMenuBlockAccessCheck
ys_core.admin_platform_admin:
  path: '/admin/platform-admin'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Platform Admin'
  requirements:
    _access_admin_menu_block_page: 'TRUE'
# Platform-admin-only settings form.
ys_core.platform_admin_settings:
  path: '/admin/yalesites/platform-admin-settings'
  defaults:
    _form: '\Drupal\ys_core\Form\PlatformAdminSettingsForm'
    _title: 'Platform Admin Settings'
  requirements:
    _permission: 'administer platform admin settings'
# Dashboard settings form.
ys_core.admin_dashboard_settings:
  path: '/admin/yalesites/dashboard-settings'
  defaults:
    _form: '\Drupal\ys_core\Form\DashboardSettingsForm'
    _title: 'Dashboard Settings'
  requirements:
    _permission: 'yalesites manage settings'
# JSON feed of announcement posts. Returns 404 unless this site is configured
# as an announcements source (ys_core.dashboard_settings:announcements_source_enabled).
ys_core.dashboard_announcements_feed:
  path: '/api/dashboard-announcements'
  defaults:
    _controller: '\Drupal\ys_core\Controller\AnnouncementsFeedController::feed'
  requirements:
    _access: 'TRUE'
  methods: [GET]
# Dynamic search page.
ys_core.search_page:
  path: '/search'
  defaults:
    _title_callback: '\Drupal\ys_core\Controller\SearchController::getTitle'
    _controller: '\Drupal\ys_core\Controller\SearchController::searchPage'
  requirements:
    _access: 'TRUE'
# Facts and Figures icon preview endpoint.
ys_core.facts_icon_preview:
  path: '/admin/ys_core/facts-icon-preview'
  defaults:
    _controller: '\Drupal\ys_core\Controller\FactsIconPreviewController::renderIcon'
  requirements:
    _permission: 'access content'
  methods: [GET]

